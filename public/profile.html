<script src="/js/auth.js"></script>
<script src="/js/push.js"></script>
<script>
const session = guardPage();
document.getElementById('profileName').textContent = session.user.name;
document.getElementById('profileEmail').textContent = session.user.email;
document.getElementById('profileRole').textContent = 'Account type: ' + session.user.role;

const avatarEl = document.getElementById('avatarInitial');
if (session.user.photoURL) {
  avatarEl.innerHTML = `<img src="${session.user.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
} else {
  avatarEl.textContent = session.user.name.charAt(0).toUpperCase();
}

document.getElementById('logoutRow').addEventListener('click', (e) => { e.preventDefault(); logout(); });

if (session.user.role === 'resident') {
  document.getElementById('notifRow').style.display = 'flex';
} else if (session.user.role === 'admin') {
  document.getElementById('usersRow').style.display = 'flex';
}

const themeSwitch = document.getElementById('themeSwitch');
themeSwitch.checked = (localStorage.getItem('sw_theme') === 'dark');
themeSwitch.addEventListener('change', () => toggleTheme(themeSwitch.checked));

// Push notifications toggle
const pushSwitch = document.getElementById('pushSwitch');
isPushSubscribed().then(subscribed => { pushSwitch.checked = subscribed; });
pushSwitch.addEventListener('change', async () => {
  pushSwitch.disabled = true;
  try {
    if (pushSwitch.checked) {
      await enablePush(session);
    } else {
      await disablePush(session);
    }
  } catch (err) {
    alert(err.message);
    pushSwitch.checked = await isPushSubscribed();
  } finally {
    pushSwitch.disabled = false;
  }
});

// Font size chips
const fontChips = document.querySelectorAll('#fontSizeChips .chip');
function syncFontChips() {
  const current = localStorage.getItem('sw_fontsize') || 'medium';
  fontChips.forEach(c => c.classList.toggle('active', c.dataset.size === current));
}
syncFontChips();
fontChips.forEach(chip => chip.addEventListener('click', () => { setFontSize(chip.dataset.size); syncFontChips(); }));

// Language chips
const langChips = document.querySelectorAll('#langChips .chip');
function syncLangChips() {
  const current = localStorage.getItem('sw_lang') || 'en';
  langChips.forEach(c => c.classList.toggle('active', c.dataset.lang === current));
}
syncLangChips();
langChips.forEach(chip => chip.addEventListener('click', () => { setLanguage(chip.dataset.lang); syncLangChips(); }));
</script>
