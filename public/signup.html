<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F766E">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Create Account — SmartWaste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
<script src="/js/fontsize.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/pwa-register.js" defer></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-logo">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7l1.9-3.3"/><path d="m10 15-3 3 3 3"/><path d="M9.8 3.8 14 8l-4 4"/><path d="m11.5 12 3.5 6"/><path d="M19.2 19h-4.8l3.5-6"/><path d="m14 21 3-3-3-3"/></svg></span>
      <span class="name" data-i18n="appName">SmartWaste</span>
    </div>

    <h2 data-i18n="createAccount">Create your account</h2>
    <p class="auth-sub" data-i18n="signUpSub">Join your community and start reporting waste issues.</p>

    <form id="signupForm">
      <label for="name" data-i18n="fullName">Full name</label>
      <input type="text" id="name" name="name" required placeholder="e.g. Ibrahim Hamisu">

      <label for="email" data-i18n="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label for="password" data-i18n="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="At least 6 characters">

      <button type="submit" class="btn btn-primary" data-i18n="createAccountBtn">Create Account</button>
      <div id="formMsg"></div>
    </form>

    <p class="auth-switch"><span data-i18n="alreadyHaveAccount">Already have an account?</span> <a href="/login.html" data-i18n="signIn">Sign in</a></p>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('formMsg');
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.textContent = 'Creating...';

  try {
    await apiSignup(name, email, password);
    msg.className = 'success';
    msg.textContent = '✅ Account created! Redirecting to sign in...';
    setTimeout(() => window.location.href = '/login.html', 1200);
  } catch (err) {
    msg.className = 'error';
    msg.textContent = '❌ ' + err.message;
    btn.disabled = false; btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
