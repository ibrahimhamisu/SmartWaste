<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F766E">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Forgot Password — SmartWaste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
<script src="/js/fontsize.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/pwa-register.js" defer></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-logo">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7l1.9-3.3"/><path d="m10 15-3 3 3 3"/><path d="M9.8 3.8 14 8l-4 4"/><path d="m11.5 12 3.5 6"/><path d="M19.2 19h-4.8l3.5-6"/><path d="m14 21 3-3-3-3"/></svg></span>
      <span class="name">Smart<span class="accent">Waste</span></span>
    </div>

    <h2>Forgot password</h2>
    <p class="auth-sub">Enter your account email and we'll generate a reset link.</p>

    <form id="forgotForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <button type="submit" class="btn btn-primary">Send reset link</button>
      <div id="formMsg"></div>
    </form>

    <div id="devLinkBox" style="display:none;margin-top:14px;padding:12px 14px;border-radius:8px;background:#E4F0E5;font-size:0.82rem;">
      <strong>Demo mode:</strong> this project doesn't send real emails yet, so here is your reset link directly —
      <a id="devLinkAnchor" href="#"></a>
    </div>

    <p class="auth-switch">Remembered your password? <a href="/login.html">Sign in</a></p>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const msg = document.getElementById('formMsg');
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.textContent = 'Sending...';

  try {
    const data = await apiForgotPassword(email);
    msg.className = 'success';
    msg.textContent = '✅ ' + data.message;

    if (data.devResetLink) {
      const box = document.getElementById('devLinkBox');
      const a = document.getElementById('devLinkAnchor');
      a.href = data.devResetLink;
      a.textContent = 'Reset your password';
      box.style.display = 'block';
    }
  } catch (err) {
    msg.className = 'error';
    msg.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});
</script>
</body>
</html>
