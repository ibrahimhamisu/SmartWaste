<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F766E">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Reset Password — SmartWaste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
<script src="/js/fontsize.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/pwa-register.js" defer></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-logo">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7l1.9-3.3"/><path d="m10 15-3 3 3 3"/><path d="M9.8 3.8 14 8l-4 4"/><path d="m11.5 12 3.5 6"/><path d="M19.2 19h-4.8l3.5-6"/><path d="m14 21 3-3-3-3"/></svg></span>
      <span class="name">Smart<span class="accent">Waste</span></span>
    </div>

    <h2>Reset your password</h2>
    <p class="auth-sub">Choose a new password for your account.</p>

    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" required placeholder="At least 6 characters">

      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required>

      <button type="submit" class="btn btn-primary">Reset Password</button>
      <div id="formMsg"></div>
    </form>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const msg = document.getElementById('formMsg');
  const btn = e.target.querySelector('button[type="submit"]');

  if (!token) {
    msg.className = 'error';
    msg.textContent = '❌ Missing or invalid reset link.';
    return;
  }
  if (newPassword !== confirmPassword) {
    msg.className = 'error';
    msg.textContent = '❌ Passwords do not match.';
    return;
  }

  btn.disabled = true; btn.textContent = 'Resetting...';
  try {
    await apiResetPassword(token, newPassword);
    msg.className = 'success';
    msg.textContent = '✅ Password reset! Redirecting to sign in...';
    setTimeout(() => window.location.href = '/login.html', 1200);
  } catch (err) {
    msg.className = 'error';
    msg.textContent = '❌ ' + err.message;
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
