<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F766E">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Home — SmartWaste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
<script src="/js/fontsize.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/pwa-register.js" defer></script>
</head>
<body class="has-bottom-nav">

<div class="topbar">
  <h1 data-i18n="appName">♻️ SmartWaste</h1>
  <span data-i18n="keepClean">Keep your community clean</span>
  <nav>
    <a href="/notifications.html" class="bell-wrap"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span><span class="dot" id="notifDot" style="display:none;">0</span></a>
    <a href="#" id="logoutLink">Logout</a>
  </nav>
</div>

<main>
  <div class="hello-card">
    <div>
      <h2 id="helloName">Hello!</h2>
      <p data-i18n="keepClean">Keep your community clean</p>
    </div>
    <div class="avatar" id="avatarInitial">?</div>
  </div>

  <a href="/report.html" class="hero-cta">
    <div>
      <strong data-i18n="reportIssue">Report an Issue</strong>
      <span data-i18n="reportIssueSub">See waste, illegal dumping, or other problem?</span>
    </div>
    <span class="arrow">→</span>
  </a>

  <div class="action-grid">
    <a href="/report.html?type=waste" class="action-card">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></span>
      <span class="label" data-i18n="reportWaste">Report Waste</span>
    </a>
    <a href="/report.html?type=illegal-dumping" class="action-card">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
      <span class="label" data-i18n="reportDumping">Report Illegal Dumping</span>
    </a>
    <a href="/my-reports.html" class="action-card">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg></span>
      <span class="label" data-i18n="myReports">My Reports</span>
    </a>
    <a href="/map.html" class="action-card">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
      <span class="label" data-i18n="mapView">Map View</span>
    </a>
  </div>

  <h3 class="section-title" data-i18n="quickStats">Quick Stats</h3>
  <div class="stats">
    <div class="stat"><span class="num" id="statTotal">0</span><span class="lbl" data-i18n="total">Total</span></div>
    <div class="stat"><span class="num" id="statPending">0</span><span class="lbl" data-i18n="pending">Pending</span></div>
    <div class="stat"><span class="num" id="statProgress">0</span><span class="lbl" data-i18n="inProgress">In progress</span></div>
    <div class="stat"><span class="num" id="statResolved">0</span><span class="lbl" data-i18n="resolved">Resolved</span></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="/index.html" class="active"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span><span data-i18n="home">Home</span></a>
  <a href="/my-reports.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg></span><span data-i18n="reports">Reports</span></a>
  <a href="/map.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span><span data-i18n="map">Map</span></a>
  <a href="/profile.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span data-i18n="profile">Profile</span></a>
</nav>

<script src="/js/auth.js"></script>
<script>
const session = guardPage('resident');

document.getElementById('helloName').textContent = 'Hello, ' + session.user.name.split(' ')[0] + '!';
const avatarEl = document.getElementById('avatarInitial');
if (session.user.photoURL) {
  avatarEl.innerHTML = `<img src="${session.user.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
} else {
  avatarEl.textContent = session.user.name.charAt(0).toUpperCase();
}
document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); logout(); });

fetch('/api/my-stats', { headers: { 'x-auth-token': session.token } })
  .then(res => res.json())
  .then(stats => {
    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statPending').textContent = stats.pending;
    document.getElementById('statProgress').textContent = stats.inProgress;
    document.getElementById('statResolved').textContent = stats.resolved;
  });

fetch('/api/notifications/unread-count', { headers: { 'x-auth-token': session.token } })
  .then(res => res.json())
  .then(data => {
    if (data.count > 0) {
      const dot = document.getElementById('notifDot');
      dot.textContent = data.count > 9 ? '9+' : data.count;
      dot.style.display = 'flex';
    }
  });
</script>
</body>
</html>
