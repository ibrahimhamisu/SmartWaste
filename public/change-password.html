<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F766E">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<title>Change Password — SmartWaste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
<script src="/js/fontsize.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/pwa-register.js" defer></script>
</head>
<body>

<div class="topbar">
  <a href="/profile.html" style="color:#fff;text-decoration:none;font-size:1.1rem;">←</a>
  <h1>Change Password</h1>
</div>

<main>
  <div class="card">
    <form id="pwForm">
      <label for="currentPassword">Current password</label>
      <input type="password" id="currentPassword" required>

      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" required placeholder="At least 6 characters">

      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" required>

      <button type="submit" class="btn btn-primary">Update Password</button>
      <div id="formMsg"></div>
    </form>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
const session = guardPage();

document.getElementById('pwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const msg = document.getElementById('formMsg');
  const btn = e.target.querySelector('button[type="submit"]');

  if (newPassword !== confirmPassword) {
    msg.className = 'error';
    msg.textContent = '❌ New password and confirmation do not match.';
    return;
  }

  btn.disabled = true; btn.textContent = 'Updating...';

  try {
    const res = await fetch('/api/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-auth-token': session.token },
      body: JSON.stringify({ currentPassword, newPassword })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');

    msg.className = 'success';
    msg.textContent = '✅ Password updated! Redirecting to Profile...';
    setTimeout(() => window.location.href = '/profile.html', 1200);
  } catch (err) {
    msg.className = 'error';
    msg.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Update Password';
  }
});
</script>
</body>
</html>
